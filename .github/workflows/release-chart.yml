name: Release Kubit

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify release versions
        shell: bash
        run: |
          chart_version="$(helm show chart charts/kubit | awk '$1 == "version:" { print $2 }')"
          app_version="$(awk -F '"' '$1 == "version = " { print $2; exit }' pyproject.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$chart_version" = "$tag_version"
          test "$app_version" = "$tag_version"
          echo "KUBIT_VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Validate and package chart
        run: |
          helm lint charts/kubit
          helm lint charts/kubit -f charts/kubit/examples/values-observability.yaml
          helm lint charts/kubit -f charts/kubit/examples/values-cnpg.yaml
          helm package charts/kubit --destination dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish container image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            KUBIT_COMMIT=${{ github.sha }}
            KUBIT_VERSION=${{ env.KUBIT_VERSION }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Kubit ${{ github.ref_name }}
          body: |
            Kubit release with a validated container image and packaged Helm chart.

            Container image: `ghcr.io/${{ github.repository }}:${{ env.KUBIT_VERSION }}`
            Image digest: `${{ steps.image.outputs.digest }}`

            See `charts/kubit/README.md` and `charts/kubit/values.yaml` for installation and configuration.
          files: dist/kubit-*.tgz
          generate_release_notes: true
