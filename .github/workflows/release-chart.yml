name: Release Kubit

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify release versions
        shell: bash
        run: |
          chart_version="$(helm show chart charts/kubit | awk '$1 == "version:" { print $2 }')"
          app_version="$(awk -F '"' '$1 == "version = " { print $2; exit }' pyproject.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$chart_version" = "$tag_version"
          test "$app_version" = "$tag_version"

      - name: Validate and package chart
        run: |
          helm lint charts/kubit
          helm lint charts/kubit -f charts/kubit/examples/values-observability.yaml
          helm lint charts/kubit -f charts/kubit/examples/values-cnpg.yaml
          helm package charts/kubit --destination dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Kubit ${{ github.ref_name }}
          body: |
            Kubit release with a validated, packaged Helm chart.

            See `charts/kubit/README.md` and `charts/kubit/values.yaml` for installation and configuration.
          files: dist/kubit-*.tgz
          generate_release_notes: true
