name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Verify release versions
        run: python3 scripts/set_version.py --check
      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool base/monitoring/dashboard.json >/dev/null
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Validate Helm chart
        run: |
          helm lint charts/kubit
          helm lint charts/kubit -f charts/kubit/examples/values-observability.yaml
          helm lint charts/kubit -f charts/kubit/examples/values-cnpg.yaml
          helm template kubit charts/kubit --namespace kubit >/dev/null
          helm template kubit charts/kubit --namespace kubit \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set grafanaDashboard.enabled=true \
            --set postgresql.enabled=true \
            --set postgresql.existingAppSecret=kubit-db-app \
            --set database.bootstrapAdmin.existingSecret=kubit-bootstrap-admin \
            >/dev/null
      - name: Build container image
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          docker build \
            --build-arg "KUBIT_COMMIT=${GITHUB_SHA}" \
            --build-arg "KUBIT_VERSION=${version}" \
            --tag kubit:test .
          docker run --rm --entrypoint python kubit:test -c \
            'from importlib.metadata import version; assert version("kubit") == "'"${version}"'"'
