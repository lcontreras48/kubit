apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kubit.fullname" . }}-test-connection"
  labels:
    {{- include "kubit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget"]
      args: ["{{ include "kubit.fullname" . }}:{{ .Values.service.port }}/healthz", "-qO-"]

