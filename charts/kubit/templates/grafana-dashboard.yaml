{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubit.fullname" . }}-dashboard
  labels:
    {{- include "kubit.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  kubit-compatibility.json: |-
    {{- .Files.Get "files/dashboards/kubit-compatibility.json" | nindent 4 }}
{{- end }}

