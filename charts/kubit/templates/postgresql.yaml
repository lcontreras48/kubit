{{- if .Values.postgresql.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "kubit.fullname" . }}-db
  labels:
    {{- include "kubit.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgresql.instances }}
  bootstrap:
    initdb:
      database: {{ .Values.postgresql.database }}
      owner: {{ .Values.postgresql.owner }}
      secret:
        name: {{ required "postgresql.existingAppSecret is required when postgresql.enabled=true" .Values.postgresql.existingAppSecret }}
  storage:
    size: {{ .Values.postgresql.storage.size }}
    {{- with .Values.postgresql.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgresql.resources | nindent 4 }}
{{- end }}

