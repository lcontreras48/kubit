config:
  clusterName: production

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: kubit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kubit-tls
      hosts:
        - kubit.example.com

serviceMonitor:
  enabled: true
  labels:
    release: prometheus

prometheusRule:
  enabled: true
  labels:
    release: prometheus

grafanaDashboard:
  enabled: true

persistence:
  storageClass: standard
  size: 1Gi

