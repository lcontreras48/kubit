image:
  repository: ghcr.io/your-org/kubit

config:
  clusterName: production

database:
  bootstrapAdmin:
    username: admin
    existingSecret: kubit-bootstrap-admin

postgresql:
  enabled: true
  instances: 3
  existingAppSecret: kubit-db-app
  storage:
    size: 20Gi
    storageClass: standard

