[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubit"
version = "1.3.0"
description = "Evidence-based Kubernetes compatibility monitor"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
kubit = "kubit.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kubit = ["web/*"]
