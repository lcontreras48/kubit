apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubit
  labels:
    app.kubernetes.io/name: kubit
    app.kubernetes.io/part-of: kubit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubit
        app.kubernetes.io/part-of: kubit
    spec:
      serviceAccountName: kubit
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubit
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubit
          image: ghcr.io/lcontreras48/kubit:1.4.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: CACHE_DIR
              value: /var/cache/kubit
          envFrom:
            - configMapRef:
                name: kubit-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: evidence-cache
              mountPath: /var/cache/kubit
      volumes:
        - name: evidence-cache
          persistentVolumeClaim:
            claimName: kubit-evidence-cache
