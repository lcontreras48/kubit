apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - monitoring/servicemonitor.yaml
  - monitoring/prometheusrule.yaml

configMapGenerator:
  - name: grafana-kubit-dashboards
    files:
      - kubit-compatibility.json=monitoring/dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
