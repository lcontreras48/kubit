apiVersion: v1
kind: ConfigMap
metadata:
  name: kubit-config
  labels:
    app.kubernetes.io/name: kubit
data:
  CLUSTER_NAME: cluster
  LOG_LEVEL: INFO
  SCAN_INTERVAL_SECONDS: "900"
  EVIDENCE_REFRESH_INTERVAL_SECONDS: "21600"
  EVIDENCE_STALE_AFTER_SECONDS: "604800"
  CATALOG_EVIDENCE_MAX_AGE_DAYS: "180"
  SECURITY_REPORT_STALE_AFTER_SECONDS: "86400"
  ARGOCD_APPLICATIONS_ENABLED: "true"
  TRIVY_REPORTS_ENABLED: "true"
  SOURCE_VALIDATION_TIMEOUT_SECONDS: "8"
  SOURCE_VALIDATION_MAX_BYTES: "1048576"
  SOURCE_VALIDATION_MAX_REDIRECTS: "5"
  SOURCE_VALIDATION_TICKET_TTL_SECONDS: "600"
  SOURCE_VALIDATION_MAX_CONCURRENT: "2"
  SOURCE_VALIDATION_ATTEMPTS_PER_MINUTE: "10"
  AUTH_LOGIN_ATTEMPTS_PER_MINUTE: "10"
  AUTH_GLOBAL_LOGIN_ATTEMPTS_PER_MINUTE: "60"

